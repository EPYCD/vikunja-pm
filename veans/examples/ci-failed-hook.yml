# Tells the referenced tasks when CI fails on their pull request, so the
# agent that owns the task (and the humans watching the board) see it
# without opening GitHub. Replace "CI" with the name of your test workflow.

name: Workman CI hook

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  notify-tasks:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: EPYCD/workman/.github/actions/workman-merge-hook@main
        with:
          mode: ci-failed
          token: ${{ secrets.WORKMAN_TOKEN }}
