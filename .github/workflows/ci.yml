name: ci

env:
  DO_NOT_TRACK: 1

on:
  pull_request:
  merge_group:
  push:
    tags:
      - v*
    branches:
      - main

concurrency:
  # main merges use a unique run_id so they don't cancel each other
  # other branches or PRs share a group to auto-cancel old runs
  group: ${{ github.ref == 'refs/heads/main' &&
    format('{0}-{1}', github.workflow, github.run_id) ||
    format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml
    secrets: inherit

  # The upstream release pipeline (.github/workflows/release.yml) is NOT wired
  # up here. Its create-release job requests `contents: write`, and a called
  # workflow's permission request is validated when the run starts, before any
  # job `if:` is evaluated — so merely referencing it failed every run on this
  # fork, pull requests included, with:
  #   The nested job 'create-release' is requesting 'contents: write',
  #   but is only allowed 'contents: read'.
  # The pipeline is upstream-only regardless: it pushes to
  # ghcr.io/go-vikunja/vikunja and needs SSH_PRIVATE_KEY, DOCKER_HUB_*,
  # RELEASE_GPG_* and APK_SIGNING_KEY, none of which exist here. The file is
  # kept as-is so upstream merges stay clean; rewire it once this fork has its
  # own release targets and secrets.
